<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Listener</title>
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f5f7fb; --card: #ffffff; --text: #0f172a; --muted: #64748b;
    --line: #e2e8f0; --accent: #1d4ed8; --accent-soft: #dbeafe;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1220; --card: #111a2e; --text: #e2e8f0; --muted: #94a3b8;
      --line: #1e293b; --accent: #60a5fa; --accent-soft: #1e3a8a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1220; --card: #111a2e; --text: #e2e8f0; --muted: #94a3b8;
    --line: #1e293b; --accent: #60a5fa; --accent-soft: #1e3a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 1; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 0;
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0 0 10px; font-size: 22px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer;
    background: var(--card); color: var(--text); font: inherit; font-weight: 600;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }
  .empty {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 32px 16px; text-align: center; color: var(--muted);
  }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 8px 16px 24px; }
</style>
</head>
<body>
<header>
  <h1>Jobs</h1>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="list"></main>
<footer>Version <span id="ver"></span></footer>

<script>
  const VERSION = "v1 · empty app · 2026-11-11";
  const TABS = ["H1B_LIST", "Workday", "Greenhouse", "Jobright"];

  document.getElementById("ver").textContent = VERSION;
  const tabsEl = document.getElementById("tabs");
  const listEl = document.getElementById("list");

  let current = TABS[0];
  try { current = localStorage.getItem("tab") || current; } catch (e) {}
  if (!TABS.includes(current)) current = TABS[0];

  function render() {
    tabsEl.innerHTML = "";
    for (const t of TABS) {
      const b = document.createElement("button");
      b.className = "tab";
      b.setAttribute("role", "tab");
      b.textContent = t;
      b.setAttribute("aria-selected", t === current);
      b.onclick = () => {
        current = t;
        try { localStorage.setItem("tab", t); } catch (e) {}
        render();
      };
      tabsEl.appendChild(b);
    }
    listEl.innerHTML = '<div class="empty"><b>No jobs yet</b>' + current + " jobs will show up here.</div>";
  }
  render();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
