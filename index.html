<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Listener</title>
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f3f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --accent: #1d4ed8; --accent-soft: #dbeafe; --fire: #ea580c; --fire-soft: #ffedd5;
    --ok: #15803d; --ok-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7;
    --chip: #f1f5f9; --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 1px 8px rgba(15, 23, 42, .04);
    --apply: #1d4ed8; --gold: #eab308; --gold-soft: #fef9c3; --gold-glow: rgba(234, 179, 8, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1220; --card: #121b2f; --text: #e2e8f0; --muted: #94a3b8; --line: #1f2a40;
      --accent: #60a5fa; --accent-soft: #1e3a8a; --fire: #fb923c; --fire-soft: #431407;
      --ok: #4ade80; --ok-soft: #14532d; --warn: #fbbf24; --warn-soft: #451a03;
      --chip: #1a2540; --shadow: none; --apply: #2563eb;
      --gold: #facc15; --gold-soft: #3a2f05; --gold-glow: rgba(250, 204, 21, .16);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1220; --card: #121b2f; --text: #e2e8f0; --muted: #94a3b8; --line: #1f2a40;
    --accent: #60a5fa; --accent-soft: #1e3a8a; --fire: #fb923c; --fire-soft: #431407;
    --ok: #4ade80; --ok-soft: #14532d; --warn: #fbbf24; --warn-soft: #451a03;
    --chip: #1a2540; --shadow: none; --apply: #2563eb;
    --gold: #facc15; --gold-soft: #3a2f05; --gold-glow: rgba(250, 204, 21, .16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 0; border-bottom: 1px solid var(--line);
  }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { margin: 0 0 8px; font-size: 21px; }
  .sub { color: var(--muted); font-size: 12px; text-align: right; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; display: inline-flex; align-items: center; gap: 5px;
    border: 0; border-radius: 999px; padding: 4px 8px 4px 11px; cursor: pointer;
    background: var(--card); color: var(--text); font: inherit; font-size: 13px; font-weight: 600;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
  .count {
    min-width: 18px; padding: 0 5px; border-radius: 999px; font-size: 11px; line-height: 18px;
    text-align: center; background: var(--chip); color: var(--muted);
  }
  .tab[aria-selected="true"] .count { background: var(--accent); color: var(--card); }
  main { padding: 12px 16px 16px; max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .note { color: var(--muted); font-size: 12px; text-align: center; }
  .job {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px;
    box-shadow: var(--shadow); transition: opacity .25s, transform .25s;
  }
  .job.h1b { border-left: 4px solid var(--fire); }
  .job.top25 {
    border: 1.5px solid var(--gold); border-left: 5px solid var(--gold);
    background: linear-gradient(135deg, var(--gold-soft), var(--card) 60%);
    box-shadow: 0 0 0 3px var(--gold-glow), var(--shadow);
  }
  .job.top25 .rank { color: #1c1400; background: var(--gold); }
  .job.gone { opacity: 0; transform: translateX(40px); }
  .row1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .company { font-weight: 800; font-size: 17px; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank { flex: none; font-size: 12px; font-weight: 700; color: var(--fire); background: var(--fire-soft); border-radius: 6px; padding: 0 6px; }
  .role { flex: none; font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .ago { margin-left: auto; flex: none; white-space: nowrap; font-size: 12px; color: var(--muted); }
  .title { font-size: 14px; margin: 2px 0 1px; }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quote { margin-top: 3px; font-size: 12px; font-style: italic; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .chip { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .actions { display: flex; gap: 6px; margin-top: 7px; }
  .btn {
    border: 0; border-radius: 9px; padding: 5px 11px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--chip); color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
  }
  .btn.apply { background: var(--apply); color: #fff; flex: 1; justify-content: center; }
  .btn.star[aria-pressed="true"] { background: var(--warn-soft); color: var(--warn); }
  .btn.done { background: var(--ok-soft); color: var(--ok); }
  .more { justify-self: center; }
  .empty {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 32px 16px; text-align: center; color: var(--muted);
  }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 16px); transform: translate(-50%, 120px);
    background: #0f172a; color: #f8fafc; border-radius: 12px; padding: 10px 14px; display: flex; gap: 14px;
    align-items: center; transition: transform .25s; max-width: calc(100% - 32px); z-index: 3;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast button { background: none; border: 0; color: #93c5fd; font: inherit; font-weight: 700; cursor: pointer; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 16px 80px; }
  .job { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .job.pressing { transform: scale(.98); }
  .headbtns { display: flex; align-items: center; gap: 10px; }
  .iconbtn { border: 0; background: var(--card); color: var(--text); border-radius: 999px; padding: 3px 10px;
    font: inherit; font-size: 12px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; }
  .overlay { position: fixed; inset: 0; background: rgba(2, 6, 23, .55); z-index: 5; display: none; align-items: flex-end; justify-content: center; }
  .overlay.show { display: flex; }
  .sheet { background: var(--card); color: var(--text); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(env(safe-area-inset-bottom) + 16px); max-height: 80vh; overflow: auto; }
  .sheet h2 { margin: 0 0 6px; font-size: 18px; }
  .sheet p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .sheet .stack { display: grid; gap: 8px; }
  .sheet .row { display: flex; gap: 8px; }
  .sheet .row .btn { flex: 1; justify-content: center; padding: 10px; }
  .sheet .stack .btn { justify-content: center; padding: 11px; }
  .btn.danger { background: #dc2626; color: #fff; }
  .btn.danger:disabled { opacity: .45; }
  .blrow { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <div class="head">
    <h1>Jobs</h1>
    <div class="headbtns">
      <span class="sub" id="sub">loading…</span>
      <button class="iconbtn" id="blBtn" aria-label="Blacklisted companies">🚫 0</button>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="list"></main>
<footer>Version <span id="ver"></span></footer>
<div class="toast" id="toast"><span id="toastText"></span><button id="undo">UNDO</button></div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
  const VERSION = "v8 · posted time + blacklist · 2026-11-11";
  const ALERTS_URL = "https://raw.githubusercontent.com/purnavasanth01/JOB-LISTENER/state/alerts.csv";
  const TARGETS_URL = "https://raw.githubusercontent.com/purnavasanth01/JOB-LISTENER/main/targets.json";
  const START = "2026-11-11";          // tabs show jobs found on/after this date (UTC); ALL shows everything
  const PAGE = 100;                    // cards drawn at a time ("Show more" adds more)
  const REFRESH_MS = 3 * 60 * 1000;    // re-read the job list every 3 minutes while the app is open

  const recent = (j) => j.found >= START;
  const TABS = [
    { name: "H1B_LIST", match: (j) => recent(j) && j.rank != null },
    { name: "Workday", match: (j) => recent(j) && j.type === "workday" },
    { name: "Greenhouse", match: (j) => recent(j) && j.type === "greenhouse" },
    { name: "Jobright", match: (j) => recent(j) && j.type === "jobright" },
    { name: "Simplify", match: (j) => recent(j) && (j.type === "simplify" || j.type === "vansh") },
    { name: "HiringCafe", match: (j) => recent(j) && j.type === "hiringcafe",
      empty: "No hiring.cafe source yet. It blocks scripts, so the listener can't read it." },
    { name: "ALL", match: () => true },
  ];
  const SOURCE_NAMES = {
    workday: "Workday", greenhouse: "Greenhouse", jobright: "Jobright list", simplify: "Simplify list",
    vansh: "vanshb03 list", amazon: "Amazon careers", microsoft: "Microsoft careers", google: "Google careers",
    orc: "Oracle Cloud", phenom: "Phenom", eightfold: "Eightfold", smartrecruiters: "SmartRecruiters",
    ashby: "Ashby", lever: "Lever", hiringcafe: "hiring.cafe",
  };
  // Jobs alerted before the listener's 2026-11-11 rule change can still say "no sponsorship" or
  // "citizens only"; hide those too (same idea as the listener's rules.py).
  const NO_SPONSOR = new RegExp([
    "not\\s+(be\\s+)?eligible\\s+for\\s+(\\w+\\s+){0,3}sponsor",
    "(not|unable to|cannot|can'?t|won'?t|will not|do not|does not|don'?t|doesn'?t|is not|are not|not able to)\\s+(\\w+\\s+){0,2}(offer|provide|support|sponsor|consider|accept)\\w*\\b[^.]{0,60}\\b(sponsor\\w*|visas?)\\b",
    "sponsor\\w*\\s+(is|are|will be)\\s+not\\s+(available|offered|provided|possible)",
    "\\bno\\s+(visa\\s+|immigration\\s+|employment\\s+)?sponsorship\\b(?!\\s+(is\\s+)?(required|needed))",
    "does not offer sponsorship",
    "citizenship or permanent work authori[sz]ation is required",
  ].join("|"), "i");
  const TRACK_RECORD = /track record of offering h-?1-?b/i;
  const blocked = (j) => NO_SPONSOR.test(j.line) || j.tags.some((t) => /no sponsorship/i.test(t));

  const COMPANY_STOP = new Set(["inc", "llc", "ltd", "corp", "corporation", "co", "company", "the", "plc", "lp",
    "group", "holdings", "technologies", "technology", "usa", "us", "na", "incorporated"]);

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const normCompany = (s) => (s || "").toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9 ]+/g, " ")
    .split(/\s+/).filter((w) => w && !COMPANY_STOP.has(w)).join("");

  let jobs = [];
  let status = load("status", {});   // job id -> "done" | "skipped"
  let stars = load("stars", {});     // job id -> true/false (missing = company autostar)
  let blacklist = load("blacklist", []);  // [{ key: normalized company, name, at }]
  let current = load("tab", "H1B_LIST");
  if (!TABS.some((t) => t.name === current)) current = TABS[0].name;
  let shown = PAGE, lastAction = null, toastTimer = null, updatedAt = null;

  $("ver").textContent = VERSION;

  // ---------- data ----------
  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') q = false;
        else field += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c !== "\r") field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    const head = rows.shift() || [];
    return rows.filter((r) => r.length > 1).map((r) => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""])));
  }

  function cleanTags(s) {
    const parts = [];
    for (const p of (s || "").split(", ")) {
      const starts = /^(⚠|🔍|🎓|MISSED|desc not checked|via L3|\d+ tech words)/.test(p);
      if (!starts && parts.length) parts[parts.length - 1] += ", " + p; else if (p) parts.push(p);
    }
    const out = [];
    for (const t of parts) {
      if (t === "desc not checked" || t === "via L3") continue;
      if (/^\d+ tech words/.test(t) && out.length && out[out.length - 1].startsWith("🔍")) { out[out.length - 1] += ", " + t; continue; }
      out.push(t);
    }
    return out;
  }

  // The job site's own posting time, in whatever format that site gives it.
  // -> { t: ms, day: true when only the date is known, plus: "30+ days" } or null when unknown.
  function parsePosted(raw, found) {
    const s = (raw || "").trim().replace(/\s+/g, " ");
    if (!s) return null;
    if (/^\d{10}$/.test(s)) return { t: +s * 1000, day: false };                    // unix seconds
    if (/^\d{13}$/.test(s)) return { t: +s, day: false };                           // unix milliseconds
    let m = s.match(/^posted (today|yesterday|(\d+)(\+?) days? ago)/i);              // Workday
    if (m) {
      const d = /today/i.test(m[1]) ? 0 : /yesterday/i.test(m[1]) ? 1 : +m[2];
      return { t: found - d * 86400000, day: true, plus: m[3] === "+" };
    }
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return { t: Date.parse(s + "T12:00:00"), day: true };
    if (/^\d{4}-\d{2}-\d{2}T/.test(s)) {
      const t = Date.parse(s.replace(/([+-]\d{2})(\d{2})$/, "$1:$2"));
      return isNaN(t) ? null : { t, day: false };
    }
    m = s.match(/^([A-Za-z]{3,9})\.? (\d{1,2})(?:,? (\d{4}))?$/);                  // "Nov 11", "November 2, 2026"
    if (m) {
      const y = m[3] ? +m[3] : new Date(found).getFullYear();
      let t = Date.parse(m[1] + " " + m[2] + ", " + y + " 12:00");
      if (!m[3] && t > found + 2 * 86400000) t = Date.parse(m[1] + " " + m[2] + ", " + (y - 1) + " 12:00");
      return isNaN(t) ? null : { t, day: true };
    }
    return null;
  }

  function buildJobs(csvText, targets) {
    const byName = new Map();
    for (const t of targets) for (const n of [t.name, ...(t.aliases || [])]) byName.set(normCompany(n), t);
    const seen = new Set(), list = [];
    for (const r of parseCSV(csvText)) {
      const id = r.url || r.company + "|" + r.title;
      if (seen.has(id)) continue;
      seen.add(id);
      const t = byName.get(normCompany(r.company));
      const type = (r.source || "").split(":")[0];
      const job = {
        id, company: t ? t.name : r.company, rank: t ? t.rank : null, autostar: !!(t && t.autostar),
        flag: t && t.flag ? t.flag : "", title: r.title, role: r.role || "", location: r.location,
        type, listener: SOURCE_NAMES[type] || type, url: r.url, line: r.evidence || "",
        tags: cleanTags(r.tags), found: r.found_at, time: Date.parse(r.found_at.replace(" ", "T") + ":00Z"),
      };
      job.posted = parsePosted(r.posted, job.time);
      if (blocked(job)) continue;
      // H1B_LIST companies are known sponsors: the "track record of offering H1B" line adds nothing there
      if (job.rank != null && TRACK_RECORD.test(job.line)) job.line = "";
      list.push(job);
    }
    return list.sort((a, b) => b.time - a.time);
  }

  async function refresh() {
    try {
      const [csvRes, tRes] = await Promise.all([fetch(ALERTS_URL, { cache: "no-store" }), fetch(TARGETS_URL, { cache: "no-store" })]);
      if (!csvRes.ok || !tRes.ok) throw new Error("HTTP " + csvRes.status + "/" + tRes.status);
      const csvText = await csvRes.text();
      const targets = (await tRes.json()).companies || [];
      jobs = buildJobs(csvText, targets);
      updatedAt = new Date();
      try { localStorage.setItem("cache", JSON.stringify({ csvText, targets, at: updatedAt.getTime() })); } catch (e) {}
    } catch (e) {
      const c = load("cache", null);
      if (c && !jobs.length) { jobs = buildJobs(c.csvText, c.targets); updatedAt = new Date(c.at); }
      if (!jobs.length) {
        $("list").innerHTML = '<div class="empty"><b>Could not load jobs</b>Check your internet and reopen the app.</div>';
        $("sub").textContent = "offline";
        return;
      }
    }
    render();
  }

  // ---------- screen ----------
  const isBlacklisted = (j) => blacklist.some((b) => b.key === normCompany(j.company));
  const isOpen = (j) => !status[j.id] && !isBlacklisted(j);
  const isStarred = (j) => (j.id in stars ? stars[j.id] : j.autostar);
  function ago(t) {
    const min = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (min < 60) return min + "m";
    if (min < 1440) return Math.floor(min / 60) + "h";
    return Math.floor(min / 1440) + "d";
  }
  const hhmm = (d) => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const dayStart = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  function whenLabel(j) {
    const p = j.posted;
    if (!p) return "found " + ago(j.time) + " ago";
    if (!p.day) return "posted " + ago(p.t) + " ago";
    const days = Math.round((dayStart(Date.now()) - dayStart(p.t)) / 86400000);
    if (p.plus) return "posted " + days + "+ days ago";
    if (days <= 0) return "posted today";
    if (days === 1) return "posted yesterday";
    if (days < 7) return "posted " + days + "d ago";
    return "posted " + new Date(p.t).toLocaleDateString([], { month: "short", day: "numeric" });
  }

  function renderTabs() {
    $("tabs").innerHTML = "";
    for (const t of TABS) {
      const n = jobs.filter((j) => isOpen(j) && t.match(j)).length;
      const b = document.createElement("button");
      b.className = "tab";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", t.name === current);
      b.innerHTML = esc(t.name) + '<span class="count">' + n + "</span>";
      b.onclick = () => { current = t.name; shown = PAGE; save("tab", current); render(); window.scrollTo(0, 0); };
      $("tabs").appendChild(b);
    }
    $("sub").textContent = updatedAt ? "updated " + hhmm(updatedAt) : "";
    $("blBtn").textContent = "🚫 " + blacklist.length;
  }

  function card(j) {
    const h1b = j.rank != null, top = h1b && j.autostar;
    const tags = [...(j.flag ? ["⚠ " + j.flag] : []), ...j.tags].map((t) => {
      const short = t.length > 90 ? t.slice(0, 88) + "…" : t;
      return '<span class="chip' + (t.startsWith("⚠") ? " warn" : "") + '" title="' + esc(t) + '">' + esc(short) + "</span>";
    }).join("");
    const starred = isStarred(j);
    return (
      '<article class="job' + (top ? " top25" : h1b ? " h1b" : "") + '" data-id="' + esc(j.id) + '">' +
        '<div class="row1">' +
          (top ? "<span>👑</span>" : h1b ? "<span>🔥</span>" : "") +
          '<span class="company">' + esc(h1b ? j.company.toUpperCase() : j.company) + "</span>" +
          (h1b ? '<span class="rank">' + (top ? "★ #" : "#") + esc(j.rank) + "</span>" : "") +
          (j.role ? '<span class="role">' + esc(j.role) + "</span>" : "") +
          '<span class="ago" title="found ' + esc(ago(j.time)) + ' ago">' + esc(whenLabel(j)) + "</span>" +
        "</div>" +
        '<div class="title">' + esc(j.title) + "</div>" +
        '<div class="meta">📍 ' + esc(j.location || "?") + " · 📡 " + esc(j.listener) + "</div>" +
        (j.line ? '<div class="quote">💬 "' + esc(j.line.slice(0, 220)) + '"</div>' : "") +
        (tags ? '<div class="chips">' + tags + "</div>" : "") +
        '<div class="actions">' +
          '<a class="btn apply" href="' + esc(j.url) + '" target="_blank" rel="noopener">Apply ↗</a>' +
          '<button class="btn star" data-act="star" aria-pressed="' + starred + '" aria-label="Star">' + (starred ? "⭐" : "☆") + "</button>" +
          '<button class="btn done" data-act="done" aria-label="Applied">✓ Applied</button>' +
          '<button class="btn" data-act="skip" aria-label="Skip">✕</button>' +
        "</div>" +
      "</article>"
    );
  }

  function renderList() {
    const tab = TABS.find((t) => t.name === current);
    const list = jobs.filter((j) => isOpen(j) && tab.match(j));
    const scope = tab.name === "ALL" ? "All jobs since Oct 31" : "Jobs found since Nov 11";
    if (!list.length) {
      $("list").innerHTML = '<div class="empty"><b>' + (tab.empty ? "Nothing here yet" : "All caught up 🎉") + "</b>" +
        esc(tab.empty || "No open " + tab.name + " jobs. " + scope + ".") + "</div>";
      return;
    }
    let html = '<div class="note">' + scope + " · newest first</div>" + list.slice(0, shown).map(card).join("");
    if (list.length > shown) html += '<button class="btn more" id="more">Show more (' + (list.length - shown) + " left)</button>";
    $("list").innerHTML = html;
    const m = $("more");
    if (m) m.onclick = () => { shown += PAGE; renderList(); };
  }

  function render() { renderTabs(); renderList(); }

  function showToast(text) {
    $("toastText").textContent = text;
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("toast").classList.remove("show"), 4000);
  }

  $("list").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const el = btn.closest(".job");
    const id = el.dataset.id;
    const job = jobs.find((j) => j.id === id);
    if (btn.dataset.act === "star") {
      stars[id] = !isStarred(job);
      save("stars", stars);
      renderList();
      return;
    }
    const act = btn.dataset.act;
    status[id] = act === "done" ? "done" : "skipped";
    save("status", status);
    lastAction = id;
    el.classList.add("gone");
    setTimeout(render, 250);
    showToast((act === "done" ? "✓ Applied: " : "✕ Skipped: ") + job.company);
  });

  $("undo").onclick = () => {
    if (lastAction) { delete status[lastAction]; save("status", status); lastAction = null; render(); }
    $("toast").classList.remove("show");
  };

  // ---------- long press -> blacklist (3 deliberate taps, so it never happens by accident) ----------
  function openSheet(html) { $("sheet").innerHTML = html; $("overlay").classList.add("show"); }
  function closeSheet() { $("overlay").classList.remove("show"); $("sheet").innerHTML = ""; }
  $("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) closeSheet(); });

  function jobMenu(job) {
    const name = esc(job.company);
    openSheet(
      "<h2>" + name + "</h2><p>" + esc(job.title) + "</p>" +
      '<div class="stack">' +
        '<a class="btn" href="' + esc(job.url) + '" target="_blank" rel="noopener">🔗 Open job</a>' +
        '<button class="btn" id="m-bl">🚫 Blacklist ' + name + "…</button>" +
        '<button class="btn" id="m-cancel">Cancel</button>' +
      "</div>");
    $("m-cancel").onclick = closeSheet;
    $("m-bl").onclick = () => confirm1(job);
  }

  function confirm1(job) {
    const name = esc(job.company);
    openSheet(
      "<h2>Blacklist " + name + "?</h2>" +
      "<p>Every " + name + " job will be hidden from all tabs on this device.</p>" +
      '<div class="row"><button class="btn" id="c1-no">Cancel</button>' +
      '<button class="btn danger" id="c1-yes">Yes, blacklist</button></div>');
    $("c1-no").onclick = closeSheet;
    $("c1-yes").onclick = () => confirm2(job);
  }

  function confirm2(job) {
    const name = esc(job.company.toUpperCase());
    openSheet(
      "<h2>⚠️ Final check</h2>" +
      "<p>Are you 100% sure you want to blacklist <b>" + name + "</b>? You can undo it later with the 🚫 button at the top.</p>" +
      // buttons swapped on purpose: a double tap in the same spot lands on Cancel
      '<div class="row"><button class="btn danger" id="c2-yes" disabled>Yes, I\'m sure (2)</button>' +
      '<button class="btn" id="c2-no">Cancel</button></div>');
    $("c2-no").onclick = closeSheet;
    let n = 2;
    const tick = setInterval(() => {
      const b = $("c2-yes");
      if (!b) return clearInterval(tick);
      n -= 1;
      if (n > 0) b.textContent = "Yes, I'm sure (" + n + ")";
      else { clearInterval(tick); b.textContent = "Yes, I'm sure"; b.disabled = false; }
    }, 1000);
    $("c2-yes").onclick = () => {
      const key = normCompany(job.company);
      if (!blacklist.some((b) => b.key === key)) blacklist.push({ key, name: job.company, at: Date.now() });
      save("blacklist", blacklist);
      closeSheet();
      render();
      lastAction = null;
      showToast("🚫 Blacklisted: " + job.company);
    };
  }

  $("blBtn").onclick = () => {
    const rows = blacklist.length
      ? blacklist.map((b, i) => '<div class="blrow"><span>' + esc(b.name) + '</span><button class="btn" data-unbl="' + i + '">Unblock</button></div>').join("")
      : "<p>No blacklisted companies.</p>";
    openSheet('<h2>🚫 Blacklisted companies</h2><p>Hidden from all tabs on this device.</p>' + rows +
      '<div class="stack" style="margin-top:12px"><button class="btn" id="bl-close">Close</button></div>');
    $("bl-close").onclick = closeSheet;
    $("sheet").querySelectorAll("[data-unbl]").forEach((b) => (b.onclick = () => {
      const item = blacklist[+b.dataset.unbl];
      openSheet("<h2>Unblock " + esc(item.name) + "?</h2><p>Its jobs will show again.</p>" +
        '<div class="row"><button class="btn" id="u-no">Cancel</button><button class="btn done" id="u-yes">Unblock</button></div>');
      $("u-no").onclick = closeSheet;
      $("u-yes").onclick = () => {
        blacklist = blacklist.filter((x) => x.key !== item.key);
        save("blacklist", blacklist);
        closeSheet();
        render();
      };
    }));
  };

  let pressTimer = null, pressStart = null, pressEl = null;
  const cancelPress = () => { clearTimeout(pressTimer); pressTimer = null; if (pressEl) pressEl.classList.remove("pressing"); pressEl = null; };
  $("list").addEventListener("pointerdown", (e) => {
    const el = e.target.closest(".job");
    if (!el || e.target.closest("button, a")) return;
    pressStart = { x: e.clientX, y: e.clientY };
    pressEl = el;
    el.classList.add("pressing");
    pressTimer = setTimeout(() => {
      const job = jobs.find((j) => j.id === el.dataset.id);
      cancelPress();
      if (job) { if (navigator.vibrate) navigator.vibrate(30); jobMenu(job); }
    }, 550);
  });
  $("list").addEventListener("pointermove", (e) => {
    if (pressStart && Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > 10) cancelPress();
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach((ev) => $("list").addEventListener(ev, cancelPress));
  $("list").addEventListener("contextmenu", (e) => {     // right-click on Mac, long press on some phones
    const el = e.target.closest(".job");
    if (!el) return;
    e.preventDefault();
    cancelPress();
    const job = jobs.find((j) => j.id === el.dataset.id);
    if (job && !$("overlay").classList.contains("show")) jobMenu(job);
  });

  refresh();
  setInterval(refresh, REFRESH_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
